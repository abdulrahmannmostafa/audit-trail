server:
  port: 8080

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
  documents:
    max-size-bytes: ${DOCUMENT_MAX_SIZE_BYTES:52428800}
    allowed-content-types: ${DOCUMENT_ALLOWED_CONTENT_TYPES:application/pdf,text/plain,image/png,image/jpeg}
  storage:
    silo:
      endpoint: http://localhost:9100
      region: us-east-1
      access-key: ${SILO_ROOT_USER:silo-admin}
      secret-key: ${SILO_ROOT_PASSWORD:silo-password-change-me}
      bucket: util-bucket

spring:
  application:
    name: util
  main:
    banner-mode: off

  devtools:
    restart:
      enabled: false

  datasource:
    # Docker's One
    url: ${DB_URL:jdbc:mysql://localhost:3307/demo_db}
    # Local's One
    # url: ${DB_URL:jdbc:mysql://localhost:3306/util}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:local-db-password}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_AUDIT_GROUP:audit-log-consumer}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": "com.qeema.util.audit.messaging"
        "[spring.json.value.default.type]": "com.qeema.util.audit.messaging.AuditEvent"

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  data:
    rest:
      base-path: /api

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/demo

logging:
  level:
    root: WARN
    org:
      hibernate:
        SQL: TRACE
        orm:
          jdbc:
            bind: TRACE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true
