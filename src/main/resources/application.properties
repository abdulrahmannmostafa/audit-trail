spring.application.name=util
spring.main.banner-mode=off

# logging.level.org.springframework.security=DEBUG
logging.level.root=WARN


# logging the SQL statements being generated by Hibernate
logging.level.org.hibernate.SQL=TRACE

# logging the binding parameters to see the actual values being used in the SQL statements
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.datasource.url=jdbc:mysql://localhost:3306/util
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.data.rest.base-path=/api

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM}