<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f4f7fb;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f4f7fb; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 600px;
              background: #ffffff;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="background: #263b80; padding: 28px 32px; color: #ffffff"
              >
                <h1 style="margin: 0; font-size: 24px">Password reset</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 40px 32px">
                <p style="margin: 0 0 16px; line-height: 1.6">
                  Hello {{name}},
                </p>
                <p style="margin: 0 0 28px; line-height: 1.6">
                  We received a request to reset your Qeema password.
                </p>
                <a
                  href="{{resetUrl}}"
                  style="
                    display: inline-block;
                    background: #263b80;
                    color: #ffffff;
                    text-decoration: none;
                    border-radius: 6px;
                    padding: 13px 22px;
                  "
                >
                  Reset password
                </a>
                <p
                  style="
                    margin: 28px 0 0;
                    color: #667085;
                    font-size: 13px;
                    line-height: 1.6;
                  "
                >
                  This link expires in {{expirationMinutes}} minutes. If you did
                  not request a reset, no action is required.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
