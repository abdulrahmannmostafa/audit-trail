<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Qeema</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f4f7fb;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f4f7fb; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 600px;
              background: #ffffff;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="background: #263b80; padding: 28px 32px; color: #ffffff"
              >
                <h1 style="margin: 0; font-size: 24px">Qeema</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 40px 32px">
                <h2 style="margin: 0 0 16px; font-size: 24px">
                  Welcome, {{name}}!
                </h2>
                <p style="margin: 0 0 16px; line-height: 1.6">
                  Your Qeema account is ready. We are glad to have you with us.
                </p>
                <p style="margin: 0 0 28px; line-height: 1.6">
                  If you need help, contact our support team at
                  <a href="mailto:{{supportEmail}}" style="color: #263b80"
                    >{{supportEmail}}</a
                  >.
                </p>
                <a
                  href="{{dashboardUrl}}"
                  style="
                    display: inline-block;
                    background: #263b80;
                    color: #ffffff;
                    text-decoration: none;
                    border-radius: 6px;
                    padding: 13px 22px;
                  "
                >
                  Open your dashboard
                </a>
              </td>
            </tr>
            <tr>
              <td
                style="
                  border-top: 1px solid #e8ecf3;
                  padding: 20px 32px;
                  color: #667085;
                  font-size: 12px;
                "
              >
                This message was sent to {{email}}.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
